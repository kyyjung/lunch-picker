<style>
  :root{
    --cream:#FFF6EC;
    --peach:#FFD9C7;
    --coral:#FF8C7A;
    --mint:#B8E8D4;
    --butter:#FFE49A;
    --choco:#6B4A3D;
    --lavender:#D9CBFF;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 15% 20%, var(--peach) 0%, transparent 40%),
      radial-gradient(circle at 85% 15%, var(--mint) 0%, transparent 35%),
      radial-gradient(circle at 80% 85%, var(--lavender) 0%, transparent 40%),
      var(--cream);
    font-family:'Gaegu', sans-serif;
    color:var(--choco);
    overflow:hidden;
    position:relative;
  }

  /* floating decorative emoji */
  .floaty{
    position:absolute;
    font-size:2rem;
    opacity:0.55;
    animation:drift 6s ease-in-out infinite;
    pointer-events:none;
    user-select:none;
  }
  @keyframes drift{
    0%,100%{ transform:translateY(0) rotate(-6deg); }
    50%{ transform:translateY(-18px) rotate(6deg); }
  }

  .stage{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
    padding:32px;
  }

  h1{
    font-family:'Jua', sans-serif;
    font-size:clamp(1.8rem, 5vw, 2.6rem);
    margin:0;
    color:var(--choco);
    text-shadow:2px 2px 0 #fff;
  }

  h1 span{
    color:var(--coral);
  }

  /* gacha machine */
  .machine{
    width:220px;
    height:230px;
    position:relative;
  }

  .globe{
    width:200px;
    height:170px;
    border-radius:50% 50% 46% 46% / 55% 55% 45% 45%;
    background:
      radial-gradient(circle at 35% 30%, #ffffff 0%, #ffffff 8%, transparent 9%),
      linear-gradient(180deg, #ffffff 0%, #eaf7ff 60%, #dff1ff 100%);
    border:5px solid #ffffff;
    box-shadow:
      inset -8px -10px 20px rgba(150,190,220,0.35),
      0 10px 18px rgba(200,160,140,0.25);
    position:relative;
    margin:0 auto;
    overflow:hidden;
  }

  .capsule{
    position:absolute;
    width:34px;
    height:34px;
    border-radius:50%;
    top:var(--t);
    left:var(--l);
  }
  .capsule::before, .capsule::after{
    content:"";
    position:absolute;
    width:34px;
    height:17px;
    left:0;
  }
  .capsule::before{ top:0; border-radius:34px 34px 0 0; background:var(--top-c); }
  .capsule::after{ bottom:0; border-radius:0 0 34px 34px; background:var(--bot-c); }

  .base{
    width:170px;
    height:70px;
    margin:0 auto;
    background:linear-gradient(180deg, var(--coral) 0%, #E9694F 100%);
    border-radius:16px 16px 26px 26px;
    position:relative;
    box-shadow:0 8px 14px rgba(150,90,70,0.25);
  }

  .base::before{ /* coin slot */
    content:"";
    position:absolute;
    width:26px;
    height:8px;
    background:#B94B34;
    border-radius:4px;
    top:14px;
    left:18px;
  }

  .knob{
    position:absolute;
    width:36px;
    height:36px;
    background:radial-gradient(circle at 35% 30%, #FFE9DE, var(--butter));
    border-radius:50%;
    right:18px;
    top:16px;
    box-shadow:0 3px 6px rgba(0,0,0,0.15);
    transition:transform .5s ease;
  }
  .machine.spin .knob{ transform:rotate(360deg); }

  .flap{
    position:absolute;
    width:40px;
    height:22px;
    background:#E9694F;
    border-radius:0 0 8px 8px;
    left:50%;
    bottom:-4px;
    transform:translateX(-50%);
  }

  /* dropped capsule animation */
  .drop-capsule{
    position:absolute;
    left:50%;
    bottom:-2px;
    width:26px;
    height:26px;
    border-radius:50%;
    background:linear-gradient(180deg, var(--butter), var(--coral));
    transform:translate(-50%, 0) scale(0);
    opacity:0;
  }
  .machine.spin .drop-capsule{
    animation:popOut 0.9s ease forwards;
  }
  @keyframes popOut{
    0%{ transform:translate(-50%, -10px) scale(0); opacity:0; }
    40%{ transform:translate(-50%, 30px) scale(1); opacity:1; }
    70%{ transform:translate(-50%, 20px) scale(1); opacity:1; }
    100%{ transform:translate(-50%, 46px) scale(1); opacity:1; }
  }

  button.roll{
    font-family:'Jua', sans-serif;
    font-size:1.25rem;
    padding:16px 40px;
    border:none;
    border-radius:999px;
    background:linear-gradient(180deg, #FFA48E 0%, var(--coral) 100%);
    color:#fff;
    cursor:pointer;
    box-shadow:0 6px 0 #D45B45, 0 10px 16px rgba(212,91,69,0.3);
    transition:transform .12s ease, box-shadow .12s ease;
    letter-spacing:1px;
  }
  button.roll:hover{ transform:translateY(-2px); }
  button.roll:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 #D45B45, 0 4px 8px rgba(212,91,69,0.3);
  }
  button.roll:disabled{
    opacity:0.7;
    cursor:default;
  }

  /* result card */
  .result-wrap{
    min-height:150px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .result-card{
    background:#fff;
    border-radius:24px;
    padding:22px 34px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    box-shadow:0 10px 0 var(--peach), 0 16px 24px rgba(150,90,70,0.15);
    opacity:0;
    transform:scale(0.6) rotate(-4deg);
    border:3px dashed var(--coral);
  }
  .result-card.show{
    animation:cardPop 0.55s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes cardPop{
    0%{ opacity:0; transform:scale(0.4) rotate(-10deg); }
    60%{ opacity:1; transform:scale(1.08) rotate(3deg); }
    100%{ opacity:1; transform:scale(1) rotate(0deg); }
  }

  .result-emoji{
    font-size:3.2rem;
    animation:wiggle 1.4s ease-in-out infinite;
  }
  @keyframes wiggle{
    0%,100%{ transform:rotate(-4deg); }
    50%{ transform:rotate(4deg); }
  }

  .result-name{
    font-family:'Jua', sans-serif;
    font-size:1.6rem;
    color:var(--choco);
  }

  .result-sub{
    font-size:0.95rem;
    color:#B08571;
  }

  .placeholder{
    font-size:1rem;
    color:#C7A891;
  }

  /* confetti */
  .confetti{
    position:fixed;
    top:-10px;
    width:8px;
    height:14px;
    border-radius:2px;
    opacity:0.9;
    pointer-events:none;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(110vh) rotate(540deg); opacity:0; }
  }

  footer{
    font-family:'Jua', sans-serif;
    font-size:0.8rem;
    color:#C7A891;
    margin-top:4px;
  }
</style>

    { name:"만두", emoji:"🥟", sub:"찐만두 어때요?" },
    { name:"훈툰면", emoji:"🍜", sub:"쫄깃한 만두가 들어간 국수" },
    { name:"알탕", emoji:"🐟", sub:"얼큰한 알탕 한 그릇" },
    { name:"회", emoji:"🐟", sub:"신선하게 즐기는 오늘의 별미" },
    { name:"치킨", emoji:"🍗", sub:"점심에도 치킨은 옳다" },
    { name:"볶음밥", emoji:"🍚", sub:"냉장고 파먹기 좋은 날" }
  ];

  const btn = document.getElementById('rollBtn');
  const machine = document.getElementById('machine');
  const resultCard = document.getElementById('resultCard');
  const resultEmoji = document.getElementById('resultEmoji');
  const resultName = document.getElementById('resultName');
  const resultSub = document.getElementById('resultSub');
  const globe = document.getElementById('globe');

  // fill globe with little colorful capsules for decoration
  const capsuleColors = ['#FF8C7A','#FFE49A','#B8E8D4','#D9CBFF','#FFB6C1','#A0D8FF'];
  const positions = [
    {t:'10%', l:'16%'}, {t:'6%', l:'50%'}, {t:'14%', l:'72%'},
    {t:'28%', l:'6%'},  {t:'26%', l:'34%'}, {t:'30%', l:'58%'}, {t:'22%', l:'80%'},
    {t:'44%', l:'18%'}, {t:'42%', l:'42%'}, {t:'46%', l:'64%'}, {t:'40%', l:'84%'},
    {t:'58%', l:'30%'}, {t:'56%', l:'52%'}
  ];

  const capsules = positions.map((p, i) => {
    const c = document.createElement('div');
    c.className = 'capsule';
    c.style.setProperty('--t', p.t);
    c.style.setProperty('--l', p.l);
    c.style.setProperty('--top-c', capsuleColors[i % capsuleColors.length]);
    c.style.setProperty('--bot-c', '#ffffff');
    globe.appendChild(c);
    return c;
  });

  // generate a smooth, meandering set of keyframes so each capsule
  // drifts and bumps around on its own path, like it's floating in water
  function driftKeyframes(amplitude){
    const steps = 5 + Math.floor(Math.random() * 3);
    const frames = [];
    for (let i = 0; i <= steps; i++){
      const x = (Math.random() - 0.5) * amplitude * 2;
      const y = (Math.random() - 0.5) * amplitude * 2;
      const r = (Math.random() - 0.5) * (amplitude * 3);
      frames.push({ transform: `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${r.toFixed(1)}deg)` });
    }
    frames.push(frames[0]); // ease back near the start so it loops smoothly
    return frames;
  }

  function startIdleFloat(el){
    return el.animate(driftKeyframes(4), {
      duration: 2200 + Math.random() * 1800,
      iterations: Infinity,
      easing: 'ease-in-out'
    });
  }

  let idleAnims = capsules.map(c => startIdleFloat(c));

  // vigorous shaking used while the machine is "rolling"
  function shakeCapsule(el){
    return el.animate(driftKeyframes(14), {
      duration: 650,
      iterations: 1,
      easing: 'ease-in-out'
    });
  }

  function launchConfetti(){
    const colors = ['#FF8C7A','#FFE49A','#B8E8D4','#D9CBFF','#FFB6C1'];
    for(let i=0;i<26;i++){
      const el = document.createElement('div');
      el.className = 'confetti';
      el.style.left = Math.random()*100 + 'vw';
      el.style.background = colors[Math.floor(Math.random()*colors.length)];
      el.style.animationDuration = (1.6 + Math.random()*1.2) + 's';
      el.style.animationDelay = (Math.random()*0.3) + 's';
      document.body.appendChild(el);
      setTimeout(()=> el.remove(), 3200);
    }
  }

  btn.addEventListener('click', () => {
    btn.disabled = true;
    resultCard.classList.remove('show');
    machine.classList.remove('spin');
    void machine.offsetWidth; // reflow to restart animation
    machine.classList.add('spin');

    // pause the gentle idle drift and make every capsule jostle around hard,
    // like the real machine is being shaken before it drops one
    idleAnims.forEach(a => a.pause());
    capsules.forEach(c => {
      const shake = shakeCapsule(c);
      shake.onfinish = () => {
        c.style.transform = ''; // clear the shake's final pose
      };
    });

    setTimeout(() => {
      const pick = menus[Math.floor(Math.random() * menus.length)];
      resultEmoji.textContent = pick.emoji;
      resultName.textContent = pick.name;
      resultSub.textContent = pick.sub;
      resultCard.classList.add('show');
      launchConfetti();
      btn.disabled = false;

      // settle back into the calm floating motion
      idleAnims = capsules.map(c => startIdleFloat(c));
    }, 700);
  });
</script>

</body>
</html>
